; TigerSSL defaults. BASE config; an admin overrides these live via the config table (tiger.tigerssl.*),
; per-org capable, no deploy (config-discipline). Secrets (the ACME account key) are NEVER set here —
; they live on disk 0600 / the secrets tier.
[production]

tiger.tigerssl.enabled = "1"

; --- Certificate authority (ACME v2 directory) ---
; Ships pointing at Let's Encrypt STAGING so first issuance can't burn production rate limit. Flip to
; production in Settings once a staging issue succeeds end-to-end.
tiger.tigerssl.ca.environment = "staging"                                                   ; staging | production
tiger.tigerssl.ca.directory.staging    = "https://acme-staging-v02.api.letsencrypt.org/directory"
tiger.tigerssl.ca.directory.production = "https://acme-v02.api.letsencrypt.org/directory"
tiger.tigerssl.ca.contact_email = ""                                                        ; expiry notices from the CA

; --- Key + challenge ---
tiger.tigerssl.key.type        = "ec"        ; ec (P-256, default) | rsa
tiger.tigerssl.key.rsa_bits     = "2048"
tiger.tigerssl.challenge.type   = "http-01"  ; http-01 (v1) | dns-01 (roadmap: wildcards)

; --- Renewal ---
tiger.tigerssl.renew.auto             = "1"
tiger.tigerssl.renew.before_days      = "30"   ; renew when <= this many days remain (LE certs live 90)
tiger.tigerssl.renew.schedule_enabled = "1"    ; register a TigerSchedule daily job when the capability exists

; --- Installer strategy (how the issued cert reaches the web server) ---
; sudo-hook   : write cert+key to install.path and run install.reload_command via a narrow sudoers entry
;               (VPS/EC2/TigerCloud — you own root; TigerCloud's AMI pre-installs the hook)
; write-only  : write cert+key+chain to install.path and STOP (you point the web server at it + reload)
; stand-down  : do nothing (host manages SSL — cPanel AutoSSL etc.); auto-detected, this is the override
tiger.tigerssl.install.strategy       = "write-only"
tiger.tigerssl.install.path           = "/etc/tiger/ssl"    ; where cert.pem / privkey.pem / chain.pem are written
tiger.tigerssl.install.reload_command = ""                  ; e.g. "systemctl reload httpd" (sudo-hook only; allow-listed)

; Detection hint for host-managed SSL (stand-down). A path that, if present, means the host owns SSL.
tiger.tigerssl.host.autossl_probe = "/usr/local/cpanel/version"

[staging : production]

[testing : production]

[development : production]
