; TigerSSL routes.
;
; The ACME HTTP-01 check hits EXACTLY http://<domain>/.well-known/acme-challenge/<token>. We answer it
; with a NATIVE route to our own controller — no .htaccess, no vhost, no static file (ARCHITECTURE §6:
; a module never touches web-server config). This folds into the config cascade and the standard Router
; resource applies it. The token is captured as :token and validated in the controller against the
; short-TTL pending-challenge cache.
[production]

resources.router.routes.tigerssl_acme.type                 = "Zend_Controller_Router_Route"
resources.router.routes.tigerssl_acme.route                = ".well-known/acme-challenge/:token"
resources.router.routes.tigerssl_acme.defaults.module      = "tigerssl"
resources.router.routes.tigerssl_acme.defaults.controller  = "well-known"
resources.router.routes.tigerssl_acme.defaults.action      = "challenge"
resources.router.routes.tigerssl_acme.reqs.token           = "[A-Za-z0-9_-]+"

[staging : production]

[testing : production]

[development : production]
