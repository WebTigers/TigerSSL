; TigerSSL module ACL.
;
; Two very different surfaces:
;   1. The ADMIN surface (certificates + settings) and its /api services — admin-and-above.
;   2. The ACME HTTP-01 CHALLENGE controller — GUEST-allowed on purpose: the certificate authority
;      fetches http://<domain>/.well-known/acme-challenge/<token> anonymously, so this ONE controller
;      must be reachable with no session. It returns only the key-authorization for a currently-pending
;      token (from a short-TTL cache) — it can't enumerate or leak anything else.
[production]

; --- admin surface (admin+) ---
acl.resources.tigerssl_admin_ctrl.resource   = "Tigerssl_AdminController"
acl.resources.tigerssl_cert_svc.resource     = "Tigerssl_Service_Certificate"
acl.resources.tigerssl_settings_svc.resource = "Tigerssl_Service_Settings"

acl.rules.tigerssl_admin.role       = "admin"
acl.rules.tigerssl_admin.resource   = "Tigerssl_AdminController"
acl.rules.tigerssl_admin.permission = "allow"

acl.rules.tigerssl_cert_svc.role       = "admin"
acl.rules.tigerssl_cert_svc.resource   = "Tigerssl_Service_Certificate"
acl.rules.tigerssl_cert_svc.permission = "allow"

acl.rules.tigerssl_settings_svc.role       = "admin"
acl.rules.tigerssl_settings_svc.resource   = "Tigerssl_Service_Settings"
acl.rules.tigerssl_settings_svc.permission = "allow"

; --- ACME challenge endpoint (guest — the CA is anonymous) ---
acl.resources.tigerssl_wellknown_ctrl.resource = "Tigerssl_WellKnownController"
acl.rules.tigerssl_wellknown.role       = "guest"
acl.rules.tigerssl_wellknown.resource   = "Tigerssl_WellKnownController"
acl.rules.tigerssl_wellknown.permission = "allow"

[staging : production]

[testing : production]

[development : production]
